<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>DEB Schiedsrichter-Gebührenabrechnung</title>
<style>
@page{size:A4;margin:0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#111}body{background:#e5e7eb;padding-bottom:24px}.toolbar{position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;justify-content:center;background:#fff;border-bottom:1px solid #ddd;padding-top:env(safe-area-inset-top)}.pdf{font:inherit;font-weight:600;padding:10px 18px;border:0;border-radius:22px;background:#eee;color:#111}.close{position:absolute;right:18px;top:9px;width:40px;height:40px;border-radius:50%;background:#eee;color:#111;font-size:27px;line-height:38px;text-align:center;text-decoration:none}.page{position:relative;width:210mm;height:297mm;margin:12px auto;background:#fff;overflow:hidden;box-shadow:0 2px 12px #999}.bg{position:absolute;inset:0;width:100%;height:100%}.v{position:absolute;z-index:2;font-size:4.55mm;line-height:1;white-space:nowrap}.money{text-align:right;width:28mm}.bold{font-weight:700}.error{display:none;margin:30px auto;max-width:600px;background:#fff;padding:20px;border-radius:12px}
/* Exact overlay positions matched to the uploaded blank DEB original */
#name{left:54mm;top:53.7mm}#street{left:54mm;top:64.4mm}#cityFull{left:54mm;top:75.0mm}#iban{left:27mm;top:85.6mm}#bic{left:154mm;top:85.6mm}
#home{left:13mm;top:115.8mm;width:86mm}#away{left:113mm;top:115.8mm;width:86mm}#place{left:33mm;top:129.4mm}#gameDate{left:122mm;top:129.4mm}
#fee{right:19.2mm;top:143.7mm}#travel{right:19.2mm;top:157.9mm}#invKm{left:65.5mm;top:172.3mm;width:10mm;text-align:center}#travel2{right:19.2mm;top:172.3mm}#hotel{right:19.2mm;top:186.6mm}#other{right:19.2mm;top:200.8mm}#total{right:19.2mm;top:215.2mm}
#cityDen{left:13mm;top:257.9mm}#bottomDate{left:68.5mm;top:257.9mm}
@media(max-width:850px){.page{transform-origin:top left;--s:calc((100vw - 24px)/793.7);transform:scale(var(--s));margin:12px;height:297mm;margin-bottom:calc((297mm * var(--s)) - 297mm + 12px)}}
@media print{body{background:#fff}.toolbar{display:none}.page{margin:0;box-shadow:none;transform:none}}
</style></head><body>
<div class="toolbar"><button class="pdf" id="pdfBtn" type="button">PDF erstellen</button><a class="close" href="./#spiele" aria-label="Rechnung schließen" title="Schließen">×</a></div>
<div class="error" id="error">Die Rechnungsdaten konnten nicht geladen werden. Bitte über „Spiele → Rechnung“ erneut öffnen.</div>
<div class="page" id="invoicePage"><img class="bg" id="template" src="./deb-rechnung-vorlage.png" alt="DEB Rechnungsvorlage">
<div class="v" id="name"></div><div class="v" id="street"></div><div class="v" id="cityFull"></div><div class="v" id="iban"></div><div class="v" id="bic"></div><div class="v" id="home"></div><div class="v" id="away"></div><div class="v" id="place"></div><div class="v" id="gameDate"></div><div class="v money" id="fee"></div><div class="v money" id="travel"></div><div class="v" id="invKm"></div><div class="v money" id="travel2"></div><div class="v money" id="hotel"></div><div class="v money" id="other"></div><div class="v money bold" id="total"></div><div class="v" id="cityDen"></div><div class="v" id="bottomDate"></div>
</div><script src="./invoice.js" defer></script></body></html>
